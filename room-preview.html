<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ZXR · Room BOM Prototype Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
      background: #141b20; color: #ecebe4; font: 14px/1.4 system-ui, sans-serif;
    }
    header {
      flex: 0 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap;
      justify-content: space-between; align-items: center; gap: 12px;
      border-bottom: 1px solid #303d44; background: #192228;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .sub { margin: 2px 0 0; font-size: 12px; color: #9db0b8; }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button, select {
      background: #27363e; color: #eef3f5; border: 1px solid #4d626c;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    button:hover, select:hover { background: #334752; }
    button[aria-pressed="true"] { background: #4c6b53; border-color: #7ea887; }
    a { color: #9fd0e6; text-decoration: none; font-size: 13px; margin-left: 6px; }
    a:hover { text-decoration: underline; }
    main { flex: 1; min-height: 0; position: relative; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status {
      position: absolute; left: 16px; bottom: 16px; padding: 8px 12px;
      background: rgba(16, 23, 28, 0.88); border: 1px solid #42535c;
      border-radius: 6px; font-size: 13px; pointer-events: none;
    }
  </style>
  <script type="module" src="/src/room-preview.ts"></script>
</head>
<body>
  <header>
    <div>
      <h1 id="title">ZXR Room Prototype Preview</h1>
      <p class="sub">Click &amp; drag to look · WASD / Arrows to walk (Shift to sprint) · Top cutaway to orbit</p>
    </div>
    <div class="controls">
      <select id="room-select" aria-label="Select prototype room">
        <option value="office">Chairman's Office</option>
        <option value="shallow-ford">Shallow Ford</option>
        <option value="well-top">Top of Well</option>
      </select>
      <button id="view-n" type="button">North</button>
      <button id="view-e" type="button">East</button>
      <button id="view-s" type="button">South</button>
      <button id="view-w" type="button">West</button>
      <button id="view-top" type="button">Top cutaway</button>
      <button id="toggle-ceiling" type="button" aria-pressed="true">Ceiling</button>
      <button id="toggle-wire" type="button" aria-pressed="false">Wireframe</button>
      <a href="./">← Play ZXR</a>
    </div>
  </header>
  <main id="viewport">
    <div id="status" role="status">Loading room…</div>
  </main>
</body>
</html>
