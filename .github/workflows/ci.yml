name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run capabilities:check
      - run: npm run planning:check
      - run: npm run contexts:check
      - run: npm run planner:check
      - run: npm run scenes:check
      - run: npm run phase6:check
      - run: npm test
      - run: npm run fuzz -- --games 2 --turns 16 --output out/fuzz/smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-smoke-results
          path: out/fuzz/*.json
          if-no-files-found: ignore
      - run: npm run zil:check
      - run: npm run semantics:check
      - run: npm run symbols:check
      - run: npm run world:check
      - run: npm run vocabulary:check
      - run: npm run logic:check
      - run: npm run operations:check
      - run: npm run memory:check
      - run: npm run parser:check
      - run: npm run source-maps:check
      - run: npm run schemas:check
      - run: npm run bundle:check
      - run: npm run output:check
      - run: npx --yes --package=. zxr check reference/zork2
      - run: node bin/zxr.ts check --conformance
      - run: npm run reference:check
      - run: npm run reference:audit -- --check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
