name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run zil:check
      - run: npm run semantics:check
      - run: npm run symbols:check
      - run: npm run world:check
      - run: npx --yes --package=. zxr check reference/zork2
      - run: npm run reference:check
      - run: npm run reference:audit -- --check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
